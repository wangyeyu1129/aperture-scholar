[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "aperture-scholar"
version = "0.1.0"
description = "Evidence-grounded research opportunity and idea recommendation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<3", "build>=1.2,<2"]
science = ["numpy>=2,<3", "networkx>=3.4,<4", "scikit-learn>=1.6,<2", "hdbscan>=0.8.40,<1"]
ui = ["streamlit>=1.42,<2"]

[project.scripts]
aperture = "aperture_scholar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aperture_scholar"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
[tool.coverage.run]
source = ["aperture_scholar"]
branch = true
